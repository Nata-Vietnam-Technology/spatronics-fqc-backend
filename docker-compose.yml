services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fqc}
      POSTGRES_USER: ${POSTGRES_USER:-fqc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fqc_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - fqc-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fqc} -d ${POSTGRES_DB:-fqc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fqc-postgres-data: